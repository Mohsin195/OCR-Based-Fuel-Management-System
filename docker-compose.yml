services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-work-api:latest
    container_name: new-work-api
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./generated_maps:/app/generated_maps
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
